:root{--marble:#1d4560;--foam:#4d7690;--gold:#a38541;--goldtx:#7a5f22;--accent:#c85f55;--line:rgba(163,133,65,.4);
--ts:.88;--serif:'Cardo','Noto Serif KR','Gowun Batang',serif;--sans:'Noto Serif KR','Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',serif}
*{box-sizing:border-box;margin:0}
body{font-family:var(--sans);color:var(--marble);line-height:1.85;-webkit-font-smoothing:antialiased;
background:linear-gradient(#e6f5ff,#d6edff);background-attachment:fixed}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button{font:inherit;color:inherit;cursor:pointer}

/* 상단 슬라이드 */
.top{max-width:1100px;width:100%;margin:0 auto;container-type:inline-size}
.slider{position:relative;touch-action:pan-y;user-select:none}
.view{overflow:hidden;aspect-ratio:var(--r,1.4615);-webkit-mask-image:linear-gradient(#000 68%,transparent 100%);mask-image:linear-gradient(#000 68%,transparent 100%)}
.slides{display:flex;height:100%;transition:transform .9s cubic-bezier(.6,0,.2,1)}
.slide{flex:0 0 100%;height:100%}
.slide img,.ph{width:100%;height:100%;display:block}
.slide img{object-fit:cover;object-position:50% 20%;pointer-events:none}
.prev::before{content:"‹"}.next::before{content:"›"}
.nav{position:absolute;top:36%;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#ffffff8c;font-size:1.4rem;line-height:1}
.prev{left:12px}.next{right:12px}
.dots{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:flex-end;gap:10px;padding-right:5%}
.dots button{width:9px;height:9px;padding:0;border-radius:50%;border:1px solid var(--goldtx);background:none}
.dots button.on{background:var(--goldtx)}
.slider.one .nav,.slider.one .dots{display:none}
.intro{text-align:left;padding:0 28px 8px calc(3% + clamp(4.4rem,15vw,9.5rem)*.22);margin-top:0;position:relative}
.sig{position:absolute;left:3%;bottom:calc(4% - .7em);margin:0;padding:.1em .22em;z-index:2;pointer-events:none;white-space:nowrap;
font-family:"Pencerio-Hairline","Gowun Batang",serif;font-weight:50;font-size:clamp(4.4rem,15vw,9.5rem);line-height:1.05;
color:#fff;-webkit-text-stroke:1.2px #fff;text-shadow:0 0 2px rgba(25,80,125,.55),0 3px 16px rgba(35,100,150,.5)}
.tagline{margin:0;max-width:38em;font-family:'Noto Serif KR','Gowun Batang',var(--serif);font-size:calc(1.08rem*var(--ts));line-height:1.95;word-break:keep-all}
@media (prefers-reduced-motion:no-preference){
body.ready .page.on .slider{animation:rise 1.1s cubic-bezier(.16,.8,.24,1) both}
body.ready .page.on .sig{-webkit-mask-image:linear-gradient(90deg,#000 40%,transparent 48%);mask-image:linear-gradient(90deg,#000 40%,transparent 48%);-webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;animation:write 1.5s cubic-bezier(.4,.1,.3,1) .7s both}
body.ready .page.on .intro>*,body.ready .page.on .plaque-row{animation:fade .8s ease 1.6s both}}
@keyframes write{from{-webkit-mask-position:100% 0;mask-position:100% 0}to{-webkit-mask-position:0 0;mask-position:0 0}}
@keyframes rise{from{opacity:0;transform:translateY(-110px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* 전체 화면 장면 넘기기 */
html,body{height:100%}
.intro .tagline{white-space:pre-line}
.intro .rich{white-space:normal;margin-top:12px;word-break:keep-all}
.rich img{max-width:100%;height:auto;vertical-align:bottom}
.tf{display:block;position:relative;max-width:100%;line-height:0}
.intro{--padL:calc(3cqw + clamp(4.4rem,15vw,9.5rem)*.22);--padR:28px}
.rich:has(.tf){max-width:none}
.rich .tf{width:calc(100% + var(--padL) + var(--padR))!important;max-width:none;margin-left:calc(var(--padL)*-1)!important;margin-right:calc(var(--padR)*-1)!important}
.tf-svg{display:block;position:relative;z-index:1;pointer-events:none}
.tf-svg svg{display:block;width:100%;height:auto}
.rich .tf-img,.rte .tf-img{position:absolute;z-index:0;max-width:none;object-fit:cover;display:block;margin:0}
.rte .tf{cursor:pointer;margin-top:8px;margin-bottom:8px}
.rte .tf.sel{outline:3px dashed #2f86d0;outline-offset:4px}
.rte .tf.sel::after{content:"선택됨 · 글자는 사진 아래 줄에 써져요";position:absolute;left:6px;top:6px;z-index:3;padding:3px 9px;background:#2f86d0;color:#fff;font:12px/1.5 sans-serif;pointer-events:none}
.rich[hidden],.plaque[hidden]{display:none}
.plaque-row{display:flex;justify-content:center;margin:calc(56px + (clamp(4.4rem,15vw,9.5rem) - 4.4rem) * .5) 0 8px;padding:0 28px}
/* 로딩 화면 */
#loader{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:linear-gradient(#e6f5ff,#d6edff);transition:opacity .5s ease,visibility 0s linear .5s}
#loader.done{opacity:0;visibility:hidden}
.ld-bar{width:min(220px,56vw);height:3px;background:rgba(163,133,65,.25);overflow:hidden}
.ld-bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .5s cubic-bezier(.3,.7,.2,1)}
.ld-txt::before{content:"LOADING"}
.ld-txt{font-family:var(--serif);font-size:.8rem;letter-spacing:.45em;padding-left:.45em;color:var(--goldtx)}
.plaque-row:has(.plaque[hidden]){display:none}
.plaque{padding:13px 28px;border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:5px;text-align:center}
.plaque b{display:block;font-family:var(--serif);font-weight:700;font-size:1.05rem;line-height:1.4;letter-spacing:.35em;padding-left:.35em;color:var(--marble)}

    pic.style.cssText = `left:${f.win.x / f.W * 100}%;top:${f.win.y / f.H * 100}%;width:${f.win.w / f.W * 100}%;height:${f.win.h / f.H * 100}%`;

function fileToBlob(f) {
  return new Promise((res, rej) => {
    if (!/^image\//.test(f.type)) return rej(new Error("이미지 파일만 넣을 수 있어요."));
    if (f.type === "image/gif") { f.size > 3e6 ? rej(new Error("GIF가 너무 커요(3MB 이하만 가능). 링크로 넣어 주세요.")) : res(f); return; }

      URL.revokeObjectURL(url);

      c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);

      c.toBlob(b => {
        if (b && b.type === "image/webp") return res(b);
        c.toBlob(b2 => b2 ? res(b2) : rej(new Error("사진을 변환하지 못했어요.")), f.type === "image/png" ? "image/png" : "image/jpeg", .88);

}
async function uploadImage(blob) {

}

/* ---- 전승: 목록 · 에피소드 페이지 · 삽화 슬라이드 ---- */
let LORE = [], CUR = null, epPushed = false, LOREGET = null;
const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

/* 에피소드 → [{img, text}] (예전 형식: 사진 목록+본문은 단락 순서대로 사진에 짝지어 줘요) */

  const imgs = e.images || [], paras = String(e.text || "").split(/\n\s*\n/).map(t => t.trim()).filter(Boolean);
  const n = Math.max(imgs.length, 1), out = [];
  for (let i = 0; i < n; i++) out.push({ img: imgs[i] || "", text: "" });
  paras.forEach((t, i) => { const o = out[Math.min(i, n - 1)]; o.text += (o.text ? "\n\n" : "") + t; });
  return out;
}
function renderLore() {

  const list = $("loreList"); list.textContent = ""; $("lore").hidden = !LORE.length;
  LORE.forEach((e, i) => {

}
/* 삽화 슬라이드: 손가락/마우스로 밀면 따라오고, 놓으면 넘어가요 */
function makeShow(urls, framed, alt, onChange) {
  const list = urls.length ? urls : [""], n = list.length;
  const wrap = mk("div", framed ? "es gf" : "es plain"), win = mk("div", "es-win"), view = mk("div", "es-view"), track = mk("div", "es-track");
  view.append(track); win.append(view); wrap.append(win);
  const place = r => wrap.style.setProperty("--r", (r > 0 ? Math.min(2.2, Math.max(.7, r)) : 1216 / 832).toFixed(4));   // 기본 1216×832, 첫 삽화 비율이 다르면 그에 맞춤
  place(1216 / 832);
  list.forEach((u, i) => { const sl = mk("div", "es-slide"); art(sl, u, alt + " 삽화 " + (i + 1), i === 0 ? im => place(im.naturalWidth / im.naturalHeight) : null); track.append(sl); });
  let idx = 0, shown = 0, x0 = null, dx = 0, cap = false;
  function paint(anim) {
    track.style.transition = anim ? "transform .55s cubic-bezier(.6,0,.2,1)" : "none";
    track.style.transform = `translateX(calc(${-idx * 100}% + ${dx}px))`;
    if (idx !== shown) { shown = idx; if (onChange) onChange(idx); }
  }
  function go(i) { idx = Math.max(0, Math.min(n - 1, i)); dx = 0; paint(true); }
  view.addEventListener("pointerdown", e => { if (n < 2) return; x0 = e.clientX; dx = 0; cap = false; });
  view.addEventListener("pointermove", e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    if (!cap && Math.abs(dx) > 6) { cap = true; try { view.setPointerCapture(e.pointerId); } catch (_) { /* 무시 */ } }
    if (!cap) return;
    let d = dx; if ((idx === 0 && d > 0) || (idx === n - 1 && d < 0)) d *= .35;   // 끝에서는 살짝만 따라와요
    track.style.transition = "none"; track.style.transform = `translateX(calc(${-idx * 100}% + ${d}px))`;
  });
  const end = () => {
    if (x0 === null) return;
    const d = dx; x0 = null; dx = 0;
    if (cap && Math.abs(d) > Math.min(60, view.clientWidth * .15)) idx = Math.max(0, Math.min(n - 1, idx + (d < 0 ? 1 : -1)));
    cap = false; paint(true);
  };

}
function showEp(i) {
  const e = LORE[i]; if (!e) return;
  const root = $("epIn"); root.textContent = "";
  const bar = mk("div", "ep-bar"), back = mk("button", "ep-back", "‹ 돌아가기"); back.type = "button"; back.onclick = closeEp;
  bar.append(back, mk("span", "ep-cnt", ROMAN(i + 1) + " / " + ROMAN(LORE.length)));
  const hd = mk("div", "ep-hd"); hd.append(mk("span", "lore-no", ROMAN(i + 1)), mk("h2", null, e.title)); if (e.sub) hd.append(mk("p", null, e.sub));

/* ---- 상단 슬라이드 ---- */
const still = matchMedia("(prefers-reduced-motion:reduce)");
let idx = 0, n = 1, timer;
function buildSlider(urls) {
  $("slides").textContent = ""; $("dots").textContent = "";
  const list = urls.length ? urls : [""]; n = list.length;
  list.forEach((u, i) => {
    const sl = document.createElement("div"); sl.className = "slide"; art(sl, u, DATA.name + " 일러스트 " + (i + 1), i === 0 ? im => setRatio(document.querySelector("header.top"), im) : null); $("slides").appendChild(sl);

  });

$("slider").addEventListener("pointerdown", e => { sx = e.clientX; });
addEventListener("pointerup", e => { if (sx === null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50 && n > 1) go(idx + (dx < 0 ? 1 : -1)); });

const sleep = ms => new Promise(r => setTimeout(r, ms));
let prog = 0;
const bump = p => { prog = Math.max(prog, p); const b = $("ldBar"); if (b) b.style.width = prog + "%"; };
let finished = false;
async function finishLoading(t0) {
  if (finished) return; finished = true;
  await sleep(Math.max(0, 800 - (performance.now() - t0)));   // 너무 번쩍 지나가지 않게 최소 시간
  bump(100); await sleep(350);
  document.body.classList.add("ready");
  const l = $("loader"); if (l) { l.classList.add("done"); setTimeout(() => l.remove(), 700); }
}
const firstImage = urls => {
  const u = (urls || []).find(ok); if (!u) return Promise.resolve();
  return Promise.race([new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; }), sleep(6000)]);
};
async function init() {
  const t0 = performance.now(); bump(8);

    if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase) {

        const { data: s } = await sb.auth.getSession(); setAdmin(s.session);
        const { data } = await Promise.race([sb.from(CFG.TABLE).select("data").eq("id", 1).maybeSingle(), sleep(8000).then(() => ({ data: null }))]);
        if (data && data.data) DATA = { ...DEFAULT, ...data.data };
      } catch (e) { /* 불러오지 못하면 기본 화면으로 */ }
    }

    await firstImage(DATA.slides && DATA.slides.length ? DATA.slides : [DATA.mainImage]); bump(95);

/* ---- 터치하면 물거품 ---- */
let live = 0; const R = Math.random, rr = () => 40 + R() * 22 | 0;
const blob = () => `${rr()}% ${rr()}% ${rr()}% ${rr()}% / ${rr()}% ${rr()}% ${rr()}% ${rr()}%`;
addEventListener("pointerdown", e => {
  if (still.matches) return;
  const box = $("bubbles"), x = e.clientX, y = e.clientY;
  const r = document.createElement("span"); r.className = "rip"; r.style.cssText = `--x:${x}px;--y:${y}px`;
  r.onanimationend = () => r.remove(); box.appendChild(r);
  for (let k = 2 + (R() * 3 | 0); k--;) {            // 한 번에 2~4개
    if (live > 36) break;
    const s = 4 + R() ** 2 * 15, dy = 110 + R() * 150 + s * 4;   // 작은 거품 위주
    const b = document.createElement("span"); b.className = "bub";
    b.style.cssText = `--x:${x + (R() - .5) * 30}px;--y:${y + (R() - .5) * 14}px;--s:${s}px;--mx:${(R() - .5) * 34}px;--ex:${(R() - .5) * 44}px;--dx:${2 + R() * 7}px;--dy:${dy}px;--d:${dy / (55 + s * 3)}s;--sw:${.6 + R() * .8}s;--bl:${.9 + R() * 1.1}s;--b1:${blob()};--b2:${blob()};--w:${R() * .25}s`;
    b.appendChild(document.createElement("i"));

    box.appendChild(b);
  }
});
